{{/* Google Analytics. Production builds only, so local previews are not counted. */}}
{{ if hugo.IsProduction }}{{ with site.Params.gaMeasurementId }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ . }}');
</script>
{{ end }}{{ end }}
