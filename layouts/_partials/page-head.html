<header class="page-head">
  <div class="wrap">
    <span class="sa-dashes" aria-hidden="true"></span>
    {{ with .Params.label }}<p class="label">{{ . }}</p>{{ end }}
    <h1>{{ .Title }}</h1>
    {{ if and .IsPage (eq .Section "news") }}
    <p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p>
    {{ end }}
    {{ with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
</header>
